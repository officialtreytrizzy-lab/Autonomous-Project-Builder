<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Autonomous Project Builder</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #0b0b0e; color: #f7f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(720px 460px at 50% -8%, rgba(150,118,255,.12), transparent 68%), #0b0b0e; }
    main { width: min(520px, calc(100vw - 56px)); padding: 36px 38px; border: 1px solid rgba(255,255,255,.075); border-radius: 20px; background: #14151a; box-shadow: 0 30px 80px rgba(0,0,0,.28); }
    .eyebrow { color: #aa92ff; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0 11px; font-size: 32px; font-weight: 620; letter-spacing: -.045em; line-height: 1.08; }
    p { margin: 0; color: #a8a9b2; line-height: 1.65; font-size: 13px; }
    .status { display: flex; gap: 11px; align-items: center; margin-top: 26px; color: #d8d8df; font-size: 12px; }
    .dot { width: 13px; height: 13px; border: 2px solid rgba(170,146,255,.22); border-top-color: #aa92ff; border-radius: 999px; animation: spin .85s linear infinite; }
    .tip { margin-top: 19px; padding-top: 17px; border-top: 1px solid rgba(255,255,255,.065); color: #70727d; font-size: 10px; line-height: 1.5; }
    .error .dot { border-color: rgba(255,120,145,.25); border-top-color: #ff7891; animation: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Opening Autonomous Builder</div>
    <h1>Preparing your workspace</h1>
    <p>Starting the private Builder runtime and reconnecting your saved workspace.</p>
    <div class="status" id="status"><span class="dot"></span><span id="message">Starting Builder…</span></div>
    <div class="tip">Your projects are saved on this computer, so closing and reopening Builder will not erase your work.</div>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    if (error) {
      document.getElementById('status').classList.add('error');
      document.getElementById('message').textContent = error;
    }
  </script>
</body>
</html>
