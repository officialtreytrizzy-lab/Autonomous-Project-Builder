<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Autonomous Project Builder</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #0b1015; color: #e7f1ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #172c25, #0b1015 58%); }
    main { width: min(560px, calc(100vw - 48px)); padding: 42px; border: 1px solid #29463b; border-radius: 22px; background: rgba(12, 20, 24, .92); box-shadow: 0 28px 80px rgba(0, 0, 0, .42); }
    .eyebrow { color: #70f0b1; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 14px 0 10px; font-size: 32px; letter-spacing: -.03em; }
    p { margin: 0; color: #aebfb7; line-height: 1.6; }
    .status { display: flex; gap: 12px; align-items: center; margin-top: 30px; color: #d8e6df; }
    .dot { width: 10px; height: 10px; border-radius: 999px; background: #70f0b1; box-shadow: 0 0 0 7px rgba(112, 240, 177, .1); animation: pulse 1.2s ease-in-out infinite; }
    .error .dot { background: #ff708a; box-shadow: 0 0 0 7px rgba(255, 112, 138, .1); animation: none; }
    @keyframes pulse { 50% { opacity: .35; transform: scale(.85); } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Private local control plane</div>
    <h1>Autonomous Project Builder</h1>
    <p>The desktop application is connecting to the supervised Builder and restoring authoritative build state.</p>
    <div class="status" id="status"><span class="dot"></span><span id="message">Starting local services…</span></div>
  </main>
  <script>
    const error = new URLSearchParams(location.search).get('error');
    if (error) {
      document.getElementById('status').classList.add('error');
      document.getElementById('message').textContent = error;
    }
  </script>
</body>
</html>
